# Free Supabase projects pause after ~7 days without activity.
# This runs a tiny read every few days so a quiet week doesn't pause BookQuest.
# If the ping fails (e.g. the project is already paused), the run fails and GitHub emails you.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */2 * *' # every 2 days at 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/user_books?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
